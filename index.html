<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1120" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ElevateCross | Microsoft Power Platform & AI Solutions</title>
    <meta
      name="description"
      content="ElevateCross builds Microsoft Power Platform, Copilot Studio, and AI automation solutions that turn real business problems into practical, working software."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ElevateCross | Microsoft Power Platform & AI Solutions" />
    <meta
      property="og:description"
      content="Power Apps, Power Automate, SharePoint, Copilot Studio, and AI automation solutions for modern businesses."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const stored = localStorage.getItem('elevatecross-theme')
        const theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
